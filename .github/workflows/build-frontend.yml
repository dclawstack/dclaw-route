name: Build frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'
      - 'backend/**'
      - 'PATCH-*.md'
      - 'PATCHES.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'
      - 'backend/**'
      - 'PATCH-*.md'
      - 'PATCHES.md'

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
        timeout-minutes: 5
